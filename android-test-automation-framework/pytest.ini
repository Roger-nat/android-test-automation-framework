[pytest]
addopts = -ra --strict-markers --html=reports/pytest-report.html --self-contained-html --junitxml=reports/junit.xml
testpaths = tests
markers =
    smoke: fast confidence tests for core application flows
    regression: broader regression coverage
    functional: functional behavior validation
    mobile: requires Android emulator/device and Appium server
    unit: does not require an Android device
